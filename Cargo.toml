[package]
name = "urlprobe"
version = "0.5.0"
authors = ["eikendev"]
edition = "2024"
description = "A tool for probing URLs for their status code"
homepage = "https://github.com/eikendev/urlprobe"
repository = "https://github.com/eikendev/urlprobe"
readme = "README.md"
license = "ISC"

[dependencies]
anyhow = "1.0.100"
argh = "0.1.13"
futures = "0.3.31"
human-panic = "2.0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros"]

# Matches the assets uploaded by release.yaml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
